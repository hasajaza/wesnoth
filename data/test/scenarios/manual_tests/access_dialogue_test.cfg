#textdomain wesnoth-test

# Wesnoth Access end-to-end test scenario: a character message with choices,
# a text input message, and scenario victory.
# Run with: wesnoth -t access_dialogue_test (see utils/access/tests/dialogue.script)

[test]
    name = _ "Wesnoth Access dialogue test"
    id = access_dialogue_test
    turns = 5
    random_start_time = no
    map_data="Xv, Xv, Xv, Xv, Xv, Xv
Xv, Gg, Gg, Gg, Gg, Xv
Xv, Gg, 1 Kh, Gg, Gg, Xv
Xv, Gg, Gg, Gg, 2 Kh, Xv
Xv, Gg, Gg, Gg, Gg, Xv
Xv, Xv, Xv, Xv, Xv, Xv"

    {DAWN}

    [side]
        side=1
        controller=human
        team_name=good
        gold=0
        [leader]
            type=Lieutenant
            id=access_hero
            name= _ "Hero"
            random_traits=no
        [/leader]
    [/side]
    [side]
        side=2
        controller=ai
        team_name=bad
        gold=0
        [leader]
            type=Orcish Grunt
            id=access_villain
            name= _ "Villain"
            random_traits=no
        [/leader]
    [/side]

    [event]
        name=start
        [message]
            speaker=access_hero
            message= _ "Which way shall we go?"
            [option]
                label= _ "Through the forest"
                [command]
                    [set_variable]
                        name=access_way
                        value=forest
                    [/set_variable]
                [/command]
            [/option]
            [option]
                label= _ "Along the river"
                [command]
                    [set_variable]
                        name=access_way
                        value=river
                    [/set_variable]
                [/command]
            [/option]
        [/message]
        [message]
            speaker=narrator
            message= _ "You chose the $access_way path. The battle is won."
        [/message]
        [endlevel]
            result=victory
            carryover_report=no
            linger_mode=no
        [/endlevel]
    [/event]
[/test]

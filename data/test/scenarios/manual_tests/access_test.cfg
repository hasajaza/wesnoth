#textdomain wesnoth-test

# Wesnoth Access end-to-end test scenario.
#
# Run with: wesnoth -t access_test --accessibility --access-speech=log ...
# (see utils/access/run_access_tests.sh). The layout is fixed so that the
# speech output of the accessibility layer can be checked automatically:
#  - side 1 (human): Lieutenant on the keep at 2,4, Spearman at 4,4
#  - side 2 (AI):    Orcish Grunt at 7,4 (visible), Orcish Warrior leader at 15,4 (in fog),
#                    Elvish Ranger hidden by ambush in the forest at 6,7
#  - village at 4,2, hills at 5,3 and 4,5, forest at 6,4 to 6,7,
#    label "Ford" on the water at 3,7, item "Treasure chest" at 4,6

[test]
    name = _ "Wesnoth Access test"
    id = access_test
    turns = 10
    random_start_time = no
    victory_when_enemies_defeated = yes
    map_data="Xv, Xv, Xv, Xv, Xv, Xv, Xv, Xv, Xv, Xv, Xv, Xv, Xv, Xv, Xv, Xv, Xv, Xv
Xv, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Xv
Xv, Gg, Ch, Gg, Gg^Vh, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Xv
Xv, Ch, Ch, Gg, Gg, Hh, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Ch, Ch, Gg, Xv
Xv, Gg, 1 Kh, Ch, Gg, Gg, Gs^Fp, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Ch, 2 Kh, Gg, Xv
Xv, Gg, Ch, Gg, Hh, Gg, Gs^Fp, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Ch, Gg, Xv
Xv, Gg, Gg, Gg, Gg, Gg, Gs^Fp, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Xv
Xv, Gg, Gg, Ww, Gg, Gg, Gs^Fp, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Xv
Xv, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Gg, Xv
Xv, Xv, Xv, Xv, Xv, Xv, Xv, Xv, Xv, Xv, Xv, Xv, Xv, Xv, Xv, Xv, Xv, Xv"

    {DAWN}
    {MORNING}
    {AFTERNOON}
    {DUSK}
    {FIRST_WATCH}
    {SECOND_WATCH}
    current_time=1

    [side]
        side=1
        controller=human
        team_name=good
        user_team_name= _ "Good"
        fog=yes
        gold=100
        income=0
        recruit=Spearman,Bowman
        suppress_end_turn_confirmation=yes
        [leader]
            type=Lieutenant
            id=access_leader
            name= _ "Leader"
            random_traits=no
        [/leader]
        [unit]
            type=Spearman
            id=access_spearman
            name= _ "Pike"
            x,y=4,4
            random_traits=no
        [/unit]
    [/side]

    [side]
        side=2
        controller=ai
        team_name=bad
        user_team_name= _ "Bad"
        fog=yes
        gold=0
        income=-2
        [leader]
            type=Orcish Warrior
            id=access_enemy_leader
            random_traits=no
        [/leader]
        [unit]
            type=Orcish Grunt
            id=access_grunt
            x,y=7,4
            random_traits=no
            ai_special=guardian
        [/unit]
        [unit]
            type=Elvish Ranger
            id=access_ranger
            x,y=6,7
            random_traits=no
            ai_special=guardian
        [/unit]
        [ai]
            passive_leader=yes
        [/ai]
    [/side]

    [label]
        x,y=3,7
        text= _ "Ford"
    [/label]

    [item]
        x,y=4,6
        image=items/chest.png
        name= _ "Treasure chest"
    [/item]

    [event]
        name=prestart
        [objectives]
            side=1
            [objective]
                description= _ "Defeat the orc leader"
                condition=win
            [/objective]
            [objective]
                description= _ "Death of your leader"
                condition=lose
            [/objective]
        [/objectives]
    [/event]
[/test]

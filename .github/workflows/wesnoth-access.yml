name: Wesnoth Access

# Builds the Wesnoth Access Windows x64 package by cross-compiling with the
# same MinGW docker image that upstream Wesnoth uses for its Windows builds,
# runs the automated tests on Linux, and smoke-tests the produced Windows
# executable on a real Windows runner.

on:
  workflow_dispatch:
    inputs:
      standalone:
        description: "Also build the large standalone package (includes all game data)"
        type: boolean
        default: false
  push:
    branches: [ wesnoth-access, "claude/**" ]
    paths-ignore: [ "doc/accessibility/**", "ACCESSIBILITY_PROGRESS.md" ]
  pull_request:
    branches: [ wesnoth-access ]

# One build per branch/PR at a time. A running build is allowed to finish
# (so every pushed milestone gets a complete result); only the newest waiting
# run is kept, older waiting runs are dropped. Pull request runs are cancelled
# when superseded.
concurrency:
  group: wesnoth-access-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Pinned by digest for reproducibility (tags mingw-master / 2204-master).
  MINGW_IMAGE: wesnoth/wesnoth@sha256:e60050f3ab2f37004716547540fac8600a18db751eb1d0a34d262819b097fa8b
  LINUX_IMAGE: wesnoth/wesnoth@sha256:958e7a4fa1933f207db2223a7ab85ffaf841e4cc46639634e4f2b24cc4417fa0
  US_COMMIT: 25e8b49c2f9df67f8baa0fbcb25fb1a0f1a3a558

jobs:
  windows-build:
    name: Windows x64 build (MinGW cross-compile)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Restore object cache
        uses: actions/cache/restore@v4
        with:
          path: build-mingw
          key: access-mingw-v1-${{ github.sha }}
          restore-keys: access-mingw-v1-

      - name: Pull build image
        run: docker pull "$MINGW_IMAGE"

      - name: Compile wesnoth.exe
        run: |
          mkdir -p build-mingw
          set -o pipefail
          docker run --rm -v "$PWD":/wesnoth -v "$PWD/build-mingw":/output "$MINGW_IMAGE" \
            sh -c 'cd /output && scons -j "$(nproc)" arch=x86-64 prefix=/msys64/mingw64 gtkdir=/msys64/mingw64 \
                   host=x86_64-w64-mingw32 -Y /wesnoth build=release nls=false force_color=false wesnoth' \
            2>&1 | tee build-mingw.log
          ls -la build-mingw/wesnoth.exe

      - name: Save object cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: build-mingw
          key: access-mingw-v1-${{ github.sha }}

      - name: Build speech dependencies
        run: |
          mkdir -p speech
          docker run --rm -e US_COMMIT -v "$PWD":/wesnoth -v "$PWD/speech":/speech "$MINGW_IMAGE" \
            sh /wesnoth/packaging/access/build_speech_deps.sh /speech

      - name: Package
        run: |
          mkdir -p dist
          extra=""
          if [ "${{ github.event.inputs.standalone }}" = "true" ]; then extra="--standalone"; fi
          docker run --rm -v "$PWD":/wesnoth -v "$PWD/build-mingw":/output -v "$PWD/speech":/speech -v "$PWD/dist":/dist "$MINGW_IMAGE" \
            python3 /wesnoth/packaging/access/make_package.py --exe /output/wesnoth.exe --source /wesnoth \
              --speech-dir /speech --out /dist --revision "${{ github.sha }}" $extra
          ls -la dist

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: WesnothAccess-win64
          path: dist/*.zip
          compression-level: 0

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-mingw
          path: build-mingw.log

  windows-smoke-test:
    name: Windows runtime smoke test
    needs: windows-build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            data
            fonts
            images
            sounds
            src/accessibility
            utils/access
          sparse-checkout-cone-mode: true

      - uses: actions/download-artifact@v4
        with: { name: WesnothAccess-win64, path: pkg }

      - name: Unpack
        shell: pwsh
        run: |
          $zip = Get-ChildItem pkg -Filter *-overlay.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath out
          Get-ChildItem out/WesnothAccess | Format-Table Name, Length

      - name: Version
        shell: pwsh
        run: |
          $p = Start-Process -FilePath out/WesnothAccess/wesnoth.exe -ArgumentList '--data-dir', "$PWD", '--version', '--log-to-file' -Wait -PassThru -NoNewWindow
          "exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Speech self-test (Universal Speech / SAPI on runner)
        if: hashFiles('src/accessibility/version.hpp') != ''
        shell: pwsh
        run: |
          $log = "$PWD/access-selftest.log"
          $p = Start-Process -FilePath out/WesnothAccess/wesnoth.exe -ArgumentList '--data-dir', "$PWD", '--access-selftest', "$log", '--log-to-file' -Wait -PassThru -NoNewWindow
          "exit code: $($p.ExitCode)"
          if (Test-Path $log) { Get-Content $log } else { "no self-test log produced"; exit 1 }
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Installer script (non-interactive, against the checked-out game data)
        if: hashFiles('src/accessibility/version.hpp') != ''
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File out/WesnothAccess/install.ps1 -GameDir "$PWD"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Content out/WesnothAccess/data-path.txt
          if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath("Desktop")) "Wesnoth Access.lnk"))) { "shortcut missing"; exit 1 }

      - name: End-to-end accessibility tests on Windows (all scripts, dummy video driver)
        if: hashFiles('src/accessibility/version.hpp') != ''
        shell: pwsh
        env:
          SDL_VIDEODRIVER: dummy
          SDL_RENDER_DRIVER: software
          SDL_AUDIODRIVER: dummy
        run: |
          New-Item -ItemType Directory -Force -Path e2e | Out-Null
          $failed = 0
          foreach ($script in Get-ChildItem utils/access/tests -Filter *.script) {
            $name = $script.BaseName
            $extra = (Select-String -Path $script.FullName -Pattern '^#ARGS:\s*(.*)$').Matches | ForEach-Object { $_.Groups[1].Value.Trim() }
            $args = @('--data-dir', "$PWD", '--userdata-dir', "$PWD/e2e/$name-userdata", '--nosound', '--nomusic', '--noaddons',
                      '--resolution=1280x800', '--windowed')
            if ($extra) { $args += ($extra -split '\s+') }
            $args += @("--access-test-script=$($script.FullName)", "--access-test-report=$PWD/e2e/$name.report",
                       '--access-speech=log', "--access-speech-log=$PWD/e2e/$name.speech.log")
            $p = Start-Process -FilePath out/WesnothAccess/wesnoth.exe -ArgumentList $args -Wait -PassThru -NoNewWindow
            $summary = if (Test-Path "e2e/$name.report") { (Select-String -Path "e2e/$name.report" -Pattern '^SUMMARY').Line } else { 'no report' }
            "$name : exit code $($p.ExitCode), $summary"
            if (Test-Path "e2e/$name.report") { Select-String -Path "e2e/$name.report" -Pattern '^FAIL' | Select-Object -First 10 | ForEach-Object { $_.Line } }
            if ($p.ExitCode -ne 0) { $failed++ }
          }
          if ($failed -ne 0) { "$failed end-to-end script(s) failed"; exit 1 }

      - name: Upload Windows test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-logs
          path: |
            access-selftest.log
            e2e/*.report
            e2e/*.log
            e2e/*-userdata/logs/*
          if-no-files-found: ignore

  linux-tests:
    name: Linux build and automated tests
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Restore object cache
        uses: actions/cache/restore@v4
        with:
          path: build-linux
          key: access-linux-v1-${{ github.sha }}
          restore-keys: access-linux-v1-

      - name: Build wesnoth and boost unit tests
        run: |
          mkdir -p build-linux
          set -o pipefail
          docker run --rm -v "$PWD":/wesnoth -v "$PWD/build-linux":/output "$LINUX_IMAGE" \
            sh -c 'rm -rf /usr/local/lib/cmake /usr/local/lib/libboost* /usr/local/include/boost && ldconfig && \
                   cd /output && scons -j "$(nproc)" -Y /wesnoth build=release nls=false force_color=false \
                   wesnoth boost_unit_tests' 2>&1 | tee build-linux.log

      - name: Save object cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: build-linux
          key: access-linux-v1-${{ github.sha }}

      - name: Run accessibility tests
        if: hashFiles('utils/access/run_access_tests.sh') != ''
        run: |
          set -o pipefail
          docker run --rm -e SDL_VIDEODRIVER=dummy -e SDL_RENDER_DRIVER=software -e SDL_AUDIODRIVER=dummy -v "$PWD":/wesnoth -v "$PWD/build-linux":/output -w /wesnoth "$LINUX_IMAGE" \
            sh -c 'rm -rf /usr/local/lib/libboost* && ldconfig && sh /wesnoth/utils/access/run_access_tests.sh /output' 2>&1 | tee access-tests.log

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-logs
          path: |
            access-tests.log
            build-linux.log
            build-linux/access-test-output/**
          if-no-files-found: ignore

  # Publishes the tested overlay package under a permanent download link:
  # https://github.com/<owner>/<repo>/releases/download/access-latest/WesnothAccess-win64-overlay.zip
  # Only for pushes to the wesnoth-access branch (and manual runs on it), and
  # only after the Windows smoke test and the Linux tests passed. The release
  # asset is replaced; the tag itself is never moved.
  publish-latest:
    name: Publish permanent download link
    needs: [ windows-smoke-test, linux-tests ]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/wesnoth-access'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: WesnothAccess-win64, path: pkg }

      - name: Upload to the access-latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          overlay=$(ls pkg/WesnothAccess-*-overlay.zip | head -n 1)
          test -n "$overlay"
          cp "$overlay" WesnothAccess-win64-overlay.zip
          sha256sum WesnothAccess-win64-overlay.zip > WesnothAccess-win64-overlay.zip.sha256
          built="$(date -u '+%Y-%m-%d %H:%M UTC')"
          notes="Latest tested build of Wesnoth Access for Battle for Wesnoth 1.18.8 (Windows 64-bit).

          Download: https://github.com/${GH_REPO}/releases/download/access-latest/WesnothAccess-win64-overlay.zip

          Built ${built} from commit ${GITHUB_SHA} ($(basename "$overlay")).
          Unpack the zip anywhere and run Install.cmd. See INSTALL.txt in the zip."
          if ! gh release view access-latest > /dev/null 2>&1; then
            gh release create access-latest --title "Wesnoth Access - latest test build" --notes "$notes" --target "$GITHUB_SHA"
          fi
          gh release upload access-latest WesnothAccess-win64-overlay.zip WesnothAccess-win64-overlay.zip.sha256 --clobber
          gh release edit access-latest --notes "$notes"
